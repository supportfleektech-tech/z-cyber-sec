line-length = 110
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: FastAPI DI idiom — Depends()/require() as argument defaults are safe
# (they are evaluated once at import time and shared; that's the intended use).
# Note: extend-immutable-calls for B008 is not honored in ruff 0.16.8 (verified
# with a minimal repro), so the rule is ignored project-wide instead.
ignore = ["E501", "UP031", "B008"]

[lint.flake8-bugbear]
extend-immutable-calls = ["Depends", "Query", "Form", "File", "UploadFile", "require"]

[lint.per-file-ignores]
"tests/*" = ["B011", "B018"]
