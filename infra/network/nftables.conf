#!/usr/sbin/nft -f
# CYBER-SEC network isolation — flow matrix (SEC-040, docs/03-network-design.md)
#
# Zones:
#   mgmt           10.40.0.0/24   operator workstation / management
#   app            10.41.0.0/24   CYBER-SEC platform (this host or app VM)
#   lab-targets    10.42.0.0/24   isolated lab targets (CTF/exercise boxes)
#
# Flow matrix (src -> dst : decision):
#   mgmt      -> app         ALLOW tcp/8080 only (admin API/SPA)
#   mgmt      -> lab-targets ALLOW tcp/22 (operator exercise access only)
#   app       -> lab-targets ALLOW tcp/8080 (exercise orchestration hooks)
#   lab-targets -> app       DENY   (targets never call back into the platform)
#   lab-targets -> mgmt      DENY
#   *         -> anywhere    DENY except established/related + loopback + DNS(53)
#
# Apply on the TARGET host (requires root + nftables):
#   sudo nft -f infra/network/nftables.conf
# Verify:  infra/network/validate_flows.sh
# The platform itself stays bound to its zone interface (0.0.0.0 inside the
# isolated VM/container); this file enforces the BOUNDARIES between zones.

flush ruleset

table inet cybersec {
    chain input {
        type filter hook input priority 0; policy drop;

        # stateful: keep established/related, drop invalid
        ct state established,related accept
        ct state invalid drop
        iif lo accept

        # management plane -> app API only
        iifname "mgmt-if" ip saddr 10.40.0.0/24 tcp dport 8080 accept

        # operator -> lab targets (exercise access)
        iifname "mgmt-if" ip saddr 10.40.0.0/24 oifname "lab-if" tcp dport 22 accept

        # app -> lab targets (exercise orchestration hooks)
        iifname "app-if" ip saddr 10.41.0.0/24 oifname "lab-if" tcp dport 8080 accept

        # DNS for the platform itself
        ip protocol udp tcp dport 53 accept
        ip protocol udp udp dport 53 accept

        # everything else: deny (default policy drop + explicit log for review)
        log prefix "cybersec-drop: " group 1
        drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
        ct state established,related accept
        ct state invalid drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        ct state invalid drop

        # app -> lab targets
        iifname "app-if" oifname "lab-if" ip saddr 10.41.0.0/24 tcp dport 8080 accept

        # mgmt -> lab targets
        iifname "mgmt-if" oifname "lab-if" ip saddr 10.40.0.0/24 tcp dport 22 accept

        # lab targets must NEVER initiate into app or mgmt (matrix: DENY)
        iifname "lab-if" drop
    }
}
