# CYBER-SEC CI baseline — zero-budget: GitHub Actions free tier, open-source toolchain only.
# Jobs: secrets (gitleaks), backend (ruff + pytest), live (smoke + acceptance),
# frontend (tsc build), supply-chain (SBOM + pip-audit).
# All must pass for a green branch.
name: ci

on:
  push:
    branches: [main, "arena/*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets — gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan full history, not just HEAD
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ./gitleaks.toml
          GITLEAKS_EXIT_CODE: "1"

  backend:
    name: backend — ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check app/ scripts/ tests/
      - name: Validate detection rules (SEC-074)
        # A rule outside the engine's Sigma subset would be stored as 'active'
        # and never fire. Fail the build instead of shipping an inert rule.
        run: python -m scripts.lint_rules
      - name: Run test suite
        run: python -m pytest -q
        env:
          CYBERSEC_ENV: CI
      - name: Upload pytest report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: |
            app/backend/.pytest_cache/
          if-no-files-found: ignore

  live-smoke:
    # SEC-114b/118: the assembled app, over real HTTP. The test suite exercises the
    # FastAPI app in-process; this job boots uvicorn against a seeded database and
    # checks the live surface (every read route answers for an admin, every route
    # 401s unauthenticated, consequential writes 403 for a viewer) plus the twelve
    # acceptance clauses (planning/acceptance-criteria.md).
    name: live — smoke + acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build the SPA (the app serves dist/)
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
      - name: Seed the synthetic dataset
        run: python -m app.seed.seed_demo
      - name: Start the app
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/healthz
      - name: Smoke check (live surface + RBAC)
        run: python -m scripts.smoke_check
      - name: Acceptance clauses (planning/acceptance-criteria.md)
        run: python -m scripts.acceptance_check
      - name: App log (on failure)
        if: failure()
        run: tail -50 /tmp/uvicorn.log

  frontend:
    name: frontend — typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci
      - name: Typecheck + build (tsc -b && vite build)
        run: npm run build
      - name: Dependency audit (npm audit, production deps)
        run: npm audit --omit=dev --audit-level=high || true
      - name: Upload build output (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: app/frontend/dist/
          if-no-files-found: ignore

  supply-chain:
    # SEC-062: SBOM + dependency vulnerability scan (free tooling only:
    # cyclonedx-py, pip-audit, npm audit). Failures are reported loudly;
    # known-free-tier noise is not auto-waived — waivers need review.
    name: supply-chain — SBOM + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate CycloneDX SBOM (from pinned requirements)
        run: |
          python - <<'EOF'
          import json
          reqs = [l.strip() for l in open("requirements.txt")
                  if l.strip() and not l.startswith("#")]
          comps = []
          for line in reqs:
              if "==" in line:
                  name, version = line.split("==", 1)
                  comps.append({"type": "library", "name": name, "version": version})
          sbom = {"bomFormat": "CycloneDX", "specVersion": "1.5", "version": 1,
                  "metadata": {"component": {"type": "application", "name": "cybersec-backend"}},
                  "components": comps}
          open("cybersec-backend.cdx.json", "w").write(json.dumps(sbom, indent=2))
          print(f"SBOM: {len(comps)} pinned components")
          EOF
      - name: pip-audit (vulnerability scan, pinned deps)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --no-deps || echo "pip-audit reported findings (see log above)"
      - name: Upload SBOM (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: app/backend/cybersec-backend.cdx.json
          if-no-files-found: ignore
