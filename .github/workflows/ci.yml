# CYBER-SEC CI baseline — zero-budget: GitHub Actions free tier, open-source toolchain only.
# Jobs: secrets (gitleaks), backend (ruff + pytest), frontend (tsc build).
# All must pass for a green branch.
name: ci

on:
  push:
    branches: [main, "arena/*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets — gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan full history, not just HEAD
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ./gitleaks.toml
          GITLEAKS_EXIT_CODE: "1"

  backend:
    name: backend — ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check app/
      - name: Run test suite
        run: python -m pytest -q
        env:
          CYBERSEC_ENV: CI
      - name: Upload pytest report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: |
            app/backend/.pytest_cache/
          if-no-files-found: ignore

  frontend:
    name: frontend — typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci
      - name: Typecheck + build (tsc -b && vite build)
        run: npm run build
      - name: Upload build output (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: app/frontend/dist/
          if-no-files-found: ignore
